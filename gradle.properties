# Настройки daemon-процесса Gradle (как в шаблоне, собранном на телефоне)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.daemon.idletimeout=10800000

# UTF-8 и локаль для daemon — убирает проблемы с русскими строками
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

android.nonTransitiveRClass=true
android.useAndroidX=true
